name: Bug report
description: Something is broken
type: bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs. actual behavior
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - MedicueCore
        - MedicuePro
        - MedicueApp
        - MedicueOmMeg
        - MedicueApiExternal
        - MedicueApiPublic
        - MedicueService
        - Tools
        - Cross-cut
